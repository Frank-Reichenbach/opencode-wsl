name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-linux:
    name: Lint & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install bats-core
        run: |
          git clone --depth 1 --branch v1.11.1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Static analysis (ShellCheck + bash syntax)
        run: bats tests/static/shellcheck.bats

      - name: Validation tests
        run: bats tests/validation/

      - name: Unit tests (bash)
        run: bats tests/unit/install-sh.bats

  lint-windows:
    name: Lint & Test (Windows)
    runs-on: windows-latest
    # Use powershell.exe (PS 5.1) so that static analysis and unit tests
    # prove Windows PowerShell 5.1 compatibility.
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer and Pester
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          # Pin Pester so CI does not drift when a new major release lands.
          Install-Module -Name Pester -RequiredVersion 6.1.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Static analysis (PSScriptAnalyzer)
        shell: powershell
        run: Invoke-Pester tests/static/ -CI

      - name: Unit tests (PowerShell)
        shell: powershell
        run: Invoke-Pester tests/unit/ -CI

  integration:
    name: Integration (Windows + WSL)
    runs-on: windows-latest
    # Use powershell.exe (PS 5.1) so that build-base.ps1 and new-project.ps1
    # execute under the same shell as real users. The lint job already proves
    # static analysis and unit tests pass on PS 5.1; this job proves the
    # full build-and-provision pipeline works end-to-end on PS 5.1.
    steps:
      - uses: actions/checkout@v7

      - uses: Vampire/setup-wsl@v7
        with:
          # setup-wsl v7 does not yet support Ubuntu-26.04. The build under
          # test imports Canonical's verified Ubuntu 26.04 WSL image itself.
          distribution: Debian-13

      - name: Resolve Ubuntu WSL image checksum
        id: rootfs-sha
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $checksumUrl = 'https://releases.ubuntu.com/26.04/SHA256SUMS'
          $sourceFile = 'ubuntu-26.04-wsl-amd64.wsl'
          . (Join-Path $env:GITHUB_WORKSPACE 'scripts/RootfsChecksum.ps1')
          $hash = Get-PublishedSha256 -ChecksumUri $checksumUrl -FileName $sourceFile
          Add-Content -Path $env:GITHUB_OUTPUT -Value "hash=$hash" -Encoding UTF8

      - name: Cache Ubuntu WSL image
        id: rootfs-cache
        uses: actions/cache@v6
        with:
          path: C:\wsl\wsl-image-cache
          key: ubuntu-wsl-image-26.04-${{ steps.rootfs-sha.outputs.hash }}

      - name: Install Pester
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          # Pin Pester so CI does not drift when a new major release lands.
          Install-Module -Name Pester -RequiredVersion 6.1.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run integration tests
        shell: powershell
        env:
          WSL_IMAGE_CACHE: C:\wsl\wsl-image-cache\ubuntu-26.04.wsl
        run: Invoke-Pester tests/integration/ -CI -Output Detailed
        timeout-minutes: 30
